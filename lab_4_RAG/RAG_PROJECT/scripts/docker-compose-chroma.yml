version: '3.8'
services:
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chroma-local
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/data
    environment:
      # Example: enable CORS for local dev (change in production)
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=http://localhost:3000
