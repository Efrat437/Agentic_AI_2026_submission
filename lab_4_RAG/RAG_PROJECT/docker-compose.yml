    mcp_server:
      build:
        context: ../../lab_13_mcp/mcp-server
      container_name: mcp-server
      environment:
        DB_USER: langchain
        DB_PASSWORD: langchain
        DB_NAME: langchain
        DB_HOST: postgres
        DB_PORT: 5432
        NODE_ENV: production
      ports:
        - "4000:4000"
      depends_on:
        - postgres
